[package]
name = "schema2object"
version = "0.2.0"
edition = "2021"
description = "JSON Schema Draft-07 runtime validator — dynamic ObjectTree with full $ref resolution."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-segmentation = "1"

[dev-dependencies]
pretty_assertions = "1"
